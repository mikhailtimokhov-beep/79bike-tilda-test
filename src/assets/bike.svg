<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" color="#2C2B3C">
  <title>Электро-эндуро, вид сбоку: заглушка вместо фото</title>
  <!-- Оригинальный нейтральный силуэт. Без логотипов, не повторяет конкретную модель.
       Используется как <svg viewBox="0 0 1600 1000"><use href="assets/bike.svg#bike"/></svg>,
       цвет берётся из currentColor. -->
  <defs>
    <symbol id="bike" viewBox="0 0 1600 1000">
      <!-- линия земли -->
      <path d="M150 898H1450" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="18 14" stroke-opacity=".45"/>

      <!-- колёса -->
      <g fill="none" stroke="currentColor">
        <circle cx="420" cy="690" r="182" stroke-width="36"/>
        <circle cx="420" cy="690" r="146" stroke-width="7" stroke-opacity=".6"/>
        <circle cx="420" cy="690" r="62" stroke-width="7"/>
        <circle cx="1215" cy="690" r="188" stroke-width="36"/>
        <circle cx="1215" cy="690" r="152" stroke-width="7" stroke-opacity=".6"/>
        <circle cx="1215" cy="690" r="78" stroke-width="7"/>
      </g>
      <g fill="currentColor">
        <circle cx="420" cy="690" r="26"/>
        <circle cx="1215" cy="690" r="26"/>
      </g>

      <!-- маятник и привод -->
      <path d="M772 584L432 668 410 710 762 632Z" fill="currentColor"/>
      <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round">
        <path d="M748 590L420 638"/>
        <path d="M748 640L420 742"/>
      </g>

      <!-- задний амортизатор -->
      <g stroke="currentColor" stroke-linecap="round" fill="none">
        <path d="M728 420L646 598" stroke-width="16"/>
        <path d="M716 456L670 556" stroke-width="34" stroke-opacity=".55"/>
      </g>

      <!-- подрамник -->
      <path d="M560 384L700 560" stroke="currentColor" stroke-width="14" stroke-linecap="round" fill="none"/>

      <!-- основная балка рамы -->
      <path d="M640 404L1052 322M1058 330L912 618" fill="none" stroke="currentColor" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- батарейный отсек -->
      <path d="M682 430L1000 372 1012 388 906 588 792 628 702 590Z" fill="currentColor" fill-opacity=".55"/>
      <path d="M720 470L960 428M730 520L930 482" stroke="currentColor" stroke-width="5" stroke-opacity=".7" fill="none" stroke-linecap="round"/>

      <!-- мотор -->
      <circle cx="762" cy="612" r="58" fill="currentColor"/>
      <circle cx="762" cy="612" r="22" fill="none" stroke="currentColor" stroke-width="6" stroke-opacity=".35"/>

      <!-- подножка -->
      <path d="M772 694H826" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>

      <!-- сиденье и хвост -->
      <path d="M522 352L902 318 930 332 916 358 562 388 516 378Z" fill="currentColor"/>
      <path d="M528 354L302 372 290 392 544 392Z" fill="currentColor"/>

      <!-- вилка -->
      <g fill="none" stroke="currentColor" stroke-linecap="round">
        <path d="M1066 272L1146 494" stroke-width="34"/>
        <path d="M1142 482L1215 690" stroke-width="22"/>
        <path d="M1036 302L1104 278M1062 368L1128 344" stroke-width="18"/>
      </g>

      <!-- руль -->
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1060 266L1044 204" stroke-width="16"/>
        <path d="M1044 204L986 190" stroke-width="12"/>
        <path d="M990 191L952 182" stroke-width="22"/>
        <path d="M1030 214L996 236" stroke-width="6"/>
      </g>

      <!-- передняя маска с фарой -->
      <path fill="currentColor" fill-rule="evenodd" d="M1098 282L1162 266 1188 388 1136 418ZM1144 312a24 24 0 1 0 .1 0Z"/>

      <!-- переднее крыло -->
      <path d="M1118 470Q1236 438 1350 512L1340 530Q1234 466 1126 494Z" fill="currentColor"/>
    </symbol>
  </defs>
  <use href="#bike"/>
</svg>
