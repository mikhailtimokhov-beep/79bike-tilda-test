<!-- 79BIKE · тестовая версия сайта. Один и тот же код вставляется в блок T123 на КАЖДОЙ странице тестового проекта Tilda.
     Какую страницу показать, загрузчик определяет по адресу: / → главная, /blog → блог, /warranty, /factory, /instructions.
     Код страниц здесь не хранится: блок подгружает последнюю проверенную сборку с GitHub Pages,
     поэтому правки появляются на Тильде без переиздания страниц.
     Отключить: удалить блок или выключить его (глаз в редакторе) и опубликовать. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #b79-frame { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; border: 0; display: block; z-index: 2147483000; background: #000; }
  #b79-note { position: fixed; inset: auto 16px 16px; z-index: 2147483001; font: 14px/1.4 system-ui, sans-serif; color: #fff; background: #1b1b22; border: 1px solid #333; border-radius: 12px; padding: 12px 14px; display: none; }
  #b79-note a { color: #a08bff; }
</style>
<div id="b79-note">Тестовая версия не загрузилась. <a id="b79-direct" target="_blank" rel="noopener">Открыть напрямую</a></div>
<script>
(function () {
  var BASE = "__PUBLIC_BASE__";             // адрес сборки на GitHub Pages
  // адрес на Тильде → файл страницы в сборке
  var MAP = { "": "index", "blog": "blog", "warranty": "warranty", "factory": "factory", "instructions": "instructions" };
  if (document.getElementById("b79-frame")) return;
  var slug = location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();
  var page = "site/rep/" + (MAP[slug] || "index") + ".html";
  var f = document.createElement("iframe");
  f.id = "b79-frame";
  f.title = "79BIKE — электромотоциклы Falcon, Lynx и Y-Volt";
  f.setAttribute("allow", "autoplay; fullscreen; clipboard-write; picture-in-picture");
  f.setAttribute("allowfullscreen", "");
  var loaded = false, note = document.getElementById("b79-note");
  f.addEventListener("load", function () { loaded = true; note.style.display = "none"; });
  function go(v) {
    // свои параметры (?s=, ?r= у блога) и якорь передаём странице как есть
    var extra = location.search ? "&" + location.search.slice(1) : "";
    var src = BASE + page + "?v=" + encodeURIComponent(v) + "&top=" + encodeURIComponent(location.origin) + extra + (location.hash || "");
    document.getElementById("b79-direct").href = src;
    f.src = src;
  }
  document.body.appendChild(f);
  // version.json всегда свежий (?t=), поэтому новая сборка видна сразу после деплоя
  fetch(BASE + "version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (j) { go(j.version); })
    .catch(function () { go(String(Date.now())); });
  setTimeout(function () { if (!loaded) note.style.display = "block"; }, 15000);
  // заголовок вкладки берём у показанной страницы
  window.addEventListener("message", function (e) {
    if (BASE.indexOf(e.origin) !== 0 || !e.data || e.data.type !== "b79-title") return;
    document.title = String(e.data.title || "").slice(0, 200);
  });
  // переход по якорю на странице Тильды прокручивает встроенную страницу
  window.addEventListener("hashchange", function () {
    var u = f.src.split("#")[0]; f.src = u + location.hash;
  });
})();
</script>
