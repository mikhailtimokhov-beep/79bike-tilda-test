Y-Volt Surge V — ночью в снегу",color:"Белый графит",tag:"лайфстайл",source:"https://www.yvolt.com/products/surge-v"}]},window.CONTENT={meta:{version:"2026-10-19",brandName:"FALCON-BIKE",phone:"+7 (999) 900-55-88",email:"Sales@79bike.ru",city:"Москва",rutube:"https://rutube.ru/channel/65461061/"},seo:{home:{title:"Электромотоциклы Falcon — официальный магазин 79BIKE",description:"Электромотоциклы и электроэндуро Falcon, Lynx и Y-Volt в официальном магазине 79BIKE. Гарантия, сервис, запчасти в наличии, доставка по России."},compare:{title:"Сравнение электромотоциклов Falcon, Lynx и Y-Volt",description:"Все модели Falcon, Lynx и Y-Volt в одной таблице: мощность, скорость, батарея, запас хода, вес и высота сиденья. Выберите электробайк под себя."},reviews:{title:"Видеообзоры электромотоциклов Falcon | 79BIKE",description:"Обзоры и тест-драйвы Falcon GT, Pro, Lynx Trail, Lite, Lynx X и Y-Volt Surge V. Смотрите байки в деле на бездорожье и трассе."}},header:{logo:"79BIKE · FALCON",badge:"Официальный магазин 79BIKE в России",menu:{models:"Модели",compareAll:"Сравнение всех моделей",reviews:"Видеообзоры",clients:"Клиентам",clientsItems:["Доставка и оплата","Инструкции","Рассрочка","Гарантия","Запчасти и аксессуары"],contacts:"Контакты"},phoneLabel:"Звоните или пишите",messengers:{telegram:"Telegram",whatsapp:"WhatsApp",vk:"ВКонтакте"},burgerOpen:"Открыть меню",burgerClose:"Закрыть меню"},hero:{title:"Электромотоциклы Falcon в официальном магазине 79BIKE",subtitle:"Электроэндуро для бездорожья, парков и загородных трасс. Гарантия, сервис и запчасти — здесь, в России. Доставка по всей стране.",facts:["Официальная гарантия","Доставка и настройка","Запчасти и аксессуары"],factsDetail:["Гарантийный ремонт в России, техподдержка на русском","Байки — ПЭК, Деловые линии и другими ТК по всей России, сборка и настройка — по запросу","Расходники и запчасти держим в наличии"],ctaPrimary:"Выбрать модель",ctaSecondary:"Сравнить модели",videoCaption:"Видео: Falcon в движении на бездорожье (фрагмент ролика с 1:17)",video:{badge:"Заставка · фрагмент с 1:17, ~12 с, по кругу",soundOn:"Включить звук",soundOff:"Выключить звук",pause:"Пауза",play:"Воспроизвести"}},advantagesSection:{title:"Технологии Falcon",subtitle:"Общее для всей линейки — один раз и по делу. Чем модели отличаются друг от друга, смотрите в карточках ниже."},advantages:[{icon:"motor",title:"Мощный мотор с мгновенным откликом",text:"Тяга приходит сразу, как только вы поворачиваете ручку газа, и ровно растёт вместе с ней. У GT, Pro и Lynx Trail двигатель с подсветкой, у Lynx X — контурная подсветка Star Ring."},{icon:"chip",title:"Контроллер 79BIKE FOC с искусственным интеллектом (AI)",text:"Контроллер с искусственным интеллектом следит за положением ручки газа, скоростью, моментом и током и подстраивает отдачу мотора под вашу манеру езды. Старт плавный, подъём — уверенный."},{icon:"battery",title:"Батареи на элементах Samsung и LG",text:"Аккумуляторы 72 В на элементах Samsung и LG. Система управления следит за температурой и нагрузкой и защищает батарею от перезаряда. Влагозащита байка — IP67."},{icon:"headlight",title:"LED-свет с датчиком освещённости",text:"Светодиодные фара и поворотники. Датчик света сам переключает фару между дневным и ночным режимом, для тёмных участков есть дальний свет."},{icon:"controls",title:"Удобное управление",text:"Режимы Eco, Drive и Sport: Eco бережёт заряд, Drive — на каждый день, Sport отдаёт всю мощность. В режиме Eco мощность можно ограничить до 3,9 кВт. Режим N — для стоянки и транспортировки. Запуск по NFC-метке — у всех моделей, кроме Lite."},{icon:"suspension",title:"Подвеска Fastace с регулировкой",text:"Перевёрнутая вилка Fastace с ходом 200 мм и регулировкой сжатия и отскока. Её настраивают под свой вес, манеру езды и покрытие."},{icon:"reverse",title:"Задний ход",text:"Выкатить байк из гаража, сдать назад на узкой тропе или развернуться на склоне можно без толкания байка руками."}],bikesSection:{title:"Выберите свой электромотоцикл",subtitle:"Шесть моделей — от Falcon Lite для первых выездов до полноразмерного Y-Volt Surge V для профессионалов.",statLabels:{power:"мощность",speed:"скорость",battery:"батарея",range:"запас хода"},colorLabel:"Цвет",photoCaption:"Фото: {name}, {color}, вид сбоку"},models:{gt:{title:"Falcon GT | 79BIKE",h1:"Электромотоцикл Falcon GT",lead:"Флагман линейки: 17 кВт, 610 Н·м и 95 км/ч. Для райдеров, которые уже уверенно чувствуют байк.",home:["У GT самый высокий крутящий момент в линейке Falcon — 610 Н·м. Широкое заднее колесо 3.0 × 18 держит траекторию на рыхлом грунте и в поворотах, а рекуперационный тормоз возвращает часть энергии в батарею.","Батарея 72 В 40 Ач на элементах Samsung 50S даёт 60–120 км запаса хода и заряжается за 3,5 ч. Большой дисплей, вес — 69 кг."],body:["Falcon GT — самая мощная модель Falcon в наличии. Пиковая мощность 17 кВт и момент 610 Н·м дают резкий разгон на выходе из поворота и запас тяги на затяжных подъёмах. Контроллер 79BIKE FOC с искусственным интеллектом дозирует мощность по положению ручки газа, поэтому байк не дёргается на малом ходу.","Широкое заднее колесо 3.0 × 18 лучше цепляется за песок, глину и траву. Вилка Fastace с ходом 200 мм и задний амортизатор с ходом 85 мм настраиваются под райдера. Тормозные диски 220 мм, а рекуперационный тормоз подзаряжает батарею при торможении.","Батарея 72 В 40 Ач собрана на элементах Samsung 50S: 60–120 км на одном заряде в зависимости от веса райдера, рельефа и режима. Полная зарядка — 3,5 ч. Байк весит 69 кг, высота сиденья 830 мм, цвет рамы — чёрный (Exclusive Black) или белый (Exclusive White)."],faq:[{q:"Какая максимальная скорость у Falcon GT?",a:"95 км/ч. Пиковая мощность мотора — 17 кВт, крутящий момент — 610 Н·м."},{q:"Подойдёт ли Falcon GT новичку?",a:"GT рассчитан на райдеров с опытом: это самая мощная модель Falcon в наличии. Если вы только начинаете, катайтесь в режиме Eco или присмотритесь к Falcon Pro и Falcon Lite — они проще в управлении."},{q:"Чем Falcon GT отличается от Falcon Pro?",a:"У GT мощнее мотор — 17 кВт против 10 кВт, выше момент — 610 Н·м против 410 Н·м, и скорость — 95 км/ч против 90 км/ч. Батарея GT больше — 40 Ач на элементах Samsung, а заднее колесо шире. Pro легче на 10 кг и проще для новичка."},{q:"Сколько Falcon GT проезжает на одном заряде?",a:"60–120 км. Запас хода зависит от веса райдера, рельефа, скорости и режима. Батарея заряжается полностью за 3,5 ч."},{q:"В каких цветах есть Falcon GT?",a:"Модельный ряд 2026 года и позднее производится в чёрном и белом цветах — Exclusive Black и Exclusive White. Наличие цвета уточняйте у менеджера при заказе."}],seoTitle:"Купить Falcon GT — электромотоцикл 17 кВт | 79BIKE",seoDescription:"Falcon GT в официальном магазине 79BIKE: 17 кВт, 610 Н·м, 95 км/ч, батарея 40 Ач. Гарантия, запчасти в наличии, доставка по России, рассрочка."},pro:{title:"Falcon Pro | 79BIKE",h1:"Электромотоцикл Falcon Pro",lead:"10 кВт, 90 км/ч и 59 кг — самый лёгкий Falcon. Простой в управлении: подойдёт новичку и тем, кто катается для удовольствия.",home:["Pro легко развернуть на узкой тропе и вытащить из колеи — он весит всего 59 кг. Мотор с моментом 410 Н·м тянет уверенно, а режимы Eco, Drive и Sport позволяют начать спокойно и прибавлять по мере опыта.","Батарея 72 В 35 Ач на элементах LG M50T — 60–120 км на одном заряде, зарядка за 3,5 ч. Рама чёрная или серебристая со вставками на выбор; у чёрной рамы есть ещё полностью чёрный вариант Black Edition (чёрная серия)."],body:["Falcon Pro — электробайк для парков, лесных дорог и лёгкого бездорожья. При весе 59 кг он самый лёгкий в линейке Falcon: его просто поднять на подставку, загрузить в прицеп и вытащить из колеи.","Мотор 10 кВт с моментом 410 Н·м разгоняет байк до 90 км/ч, а контроллер FOC с искусственным интеллектом подстраивает отдачу под манеру езды — старт мягкий даже у новичка. Режимы Eco, Drive и Sport переключаются кнопкой на руле. Оба колеса 70/100-19, спереди — вилка Fastace с ходом 200 мм, сзади — амортизатор с ходом 85 мм.","Батарея 72 В 35 Ач на элементах LG M50T даёт 60–120 км запаса хода и заряжается за 3,5 ч. Тормозные диски 220 мм, высота сиденья 820 мм. Рама чёрная или серебристая, вставки фиолетовые, жёлтые или красные. К чёрной раме есть ещё полностью чёрный вариант Black Edition (чёрная серия)."],faq:[{q:"Какая максимальная скорость у Falcon Pro?",a:"90 км/ч. Пиковая мощность мотора — 10 кВт, крутящий момент — 410 Н·м."},{q:"Подойдёт ли Falcon Pro новичку?",a:"Да. Pro — самый лёгкий Falcon, 59 кг, и прощает ошибки. Начните в режиме Eco, а когда освоитесь, переключайтесь на Drive и Sport."},{q:"Можно ли ездить на Falcon Pro в дождь?",a:"Да. Влагозащита Falcon Pro — IP67, дождь и лужи ему не помеха. Но не мойте байк под сильным напором и не заезжайте в глубокий брод: попадание воды внутрь узлов не покрывается гарантией."},{q:"Какие цвета есть у Falcon Pro?",a:"Рама чёрная или серебристая со вставками фиолетового, жёлтого или красного цвета: Black Purple, Black Red, Black Yellow, Silver Purple, Silver Red и Silver Yellow. К чёрной раме есть ещё полностью чёрный вариант Black Edition (чёрная серия). Наличие сочетания уточняйте у менеджера."},{q:"Сколько Falcon Pro проезжает на одном заряде?",a:"60–120 км в зависимости от веса райдера, рельефа, скорости и режима. Полная зарядка — 3,5 ч."}],seoTitle:"Купить Falcon Pro — лёгкий электромотоцикл | 79BIKE",seoDescription:"Falcon Pro в официальном магазине 79BIKE: 10 кВт, 90 км/ч, 59 кг, батарея 35 Ач. Подходит новичкам. Гарантия, сервис, доставка по России."},"lynx-trail":{title:"Falcon Lynx Trail | 79BIKE",h1:"Электромотоцикл Falcon Lynx Trail",lead:"Байк для высоких райдеров: редуктор с моментом 405 Н·м, задняя подвеска с ходом 200 мм и батарея 40 Ач.",home:["Lynx Trail рассчитан на высоких райдеров весом до 120 кг: сиденье 855 мм и колёсная база 1270 мм. Задняя подвеска с ходом 200 мм — у GT, Pro и Lite 85 мм — мягче проходит кочки, а привод через редуктор передаёт на колесо 405 Н·м: тяги хватает на подъёмах и в грязи.","Встроенная Bluetooth-колонка: подключите телефон — и музыка играет прямо в поездке. Батарея 72 В 40 Ач на элементах LG, запас хода 60–120 км, зарядка за 4 ч. Скорость до 90 км/ч, вес 69 кг."],body:["Falcon Lynx Trail сделан для высоких райдеров. Максимальная нагрузка по данным производителя — 120 кг. Задняя подвеска с ходом 200 мм — у GT, Pro и Lite 85 мм — мягче проходит кочки и колею. Переднее колесо 80/100-19, заднее 3.0 × 18, высота сиденья 855 мм.","Мотор 10 кВт работает через редуктор и выдаёт 405 Н·м крутящего момента. Байк уверенно тянет на подъёмах, в песке и грязи. Ход подвески — 200 мм и спереди, и сзади. Максимальная скорость — 90 км/ч, тормозные диски 220 мм.","Батарея 72 В 40 Ач на элементах LG NMC M50T рассчитана на 60–120 км и заряжается за 4 ч. В байк встроена Bluetooth-колонка: подключите телефон и включайте треки с него прямо во время поездки. Lynx Trail поддерживает фирменное приложение 79BIKE; в России оно пока работает в тестовом режиме и может работать не всегда корректно."],faq:[{q:"На какой рост рассчитан Falcon Lynx Trail?",a:"На высоких райдеров: сиденье 855 мм, колёсная база 1270 мм, задняя подвеска с ходом 200 мм. Максимальная нагрузка по данным производителя — 120 кг. Если нужна посадка выше — посмотрите Lynx X с сиденьем 870 мм (старт продаж — 2027). Проверить посадку можно в блоке «Примерка по росту» выше на странице, а точно — на тест-драйве в шоуруме (по звонку)."},{q:"Как работает музыка и что умеет приложение?",a:"В Lynx Trail встроена Bluetooth-колонка: подключаете телефон и включаете треки с него прямо во время поездки. Байк поддерживает фирменное приложение 79Cloud (App Store и Google Play): запуск без ключа, данные поездки, настройка режимов, сервис и диагностика. В России оно пока работает в тестовом режиме: отдельные функции могут работать не всегда корректно, и производитель продолжает его дорабатывать. Основные функции байка от приложения не зависят — всё управление на руле. Актуальные возможности подскажет менеджер."},{q:"Сколько стоит Falcon Lynx Trail?",a:"355 000 ₽. Наличие цветов уточнит менеджер — оставьте номер или позвоните. Рассрочка доступна и на эту модель."},{q:"Чем Lynx Trail отличается от Lynx X?",a:"Lynx X — самая мощная версия линейки Lynx: 26 кВт против 10 кВт, батарея 60 Ач против 40 Ач, более широкое заднее колесо и сиденье выше — 870 мм против 855 мм. Lynx Trail уже в продаже, старт продаж Lynx X — 2027."},{q:"Сколько заряжается Lynx Trail?",a:"Полная зарядка — 4 ч. Запас хода — 60–120 км в зависимости от веса райдера, рельефа и режима."}],seoTitle:"Купить Falcon Lynx Trail — электроэндуро | 79BIKE",seoDescription:"Falcon Lynx Trail для высоких райдеров: редуктор, 405 Н·м, подвеска 200 мм, батарея 40 Ач, Bluetooth-колонка. Официальный магазин 79BIKE."},light:{title:"Falcon Lite | 79BIKE",h1:"Электромотоцикл Falcon Lite",lead:"Самый доступный Falcon: 8 кВт, 84 км/ч и только то, что действительно нужно для езды.",home:["Lite — байк для первых выездов, парков и загородных трасс без лишних опций. Мотор 8 кВт с моментом 340 Н·м и три режима: Eco, Drive и Sport.","Батарея 72 В 30 Ач на элементах LG — 60–80 км запаса хода и самая быстрая зарядка в линейке, 3 ч. Сиденье 820 мм — самое низкое среди Falcon (как у Pro), вес 63 кг."],body:["Falcon Lite — понятный вход в мир электроэндуро. Ничего лишнего: надёжный мотор, ровная тяга и низкая посадка. Без NFC-запуска и подсветки двигателя, зато дешевле остальных Falcon. Хороший выбор, если вы только начинаете или хотите байк для спокойных поездок за городом.","Мотор 8 кВт выдаёт 340 Н·м и разгоняет байк до 84 км/ч. Режимы Eco, Drive и Sport помогают освоиться постепенно. Подвеска — как у старших моделей: вилка Fastace с ходом 200 мм и задний амортизатор с ходом 85 мм. Тормозные диски: 220 мм спереди и 203 мм сзади.","Батарея 72 В 30 Ач на элементах LG NMC M50LT рассчитана на 60–80 км и заряжается за 3 ч — быстрее остальных моделей Falcon. Высота сиденья 820 мм, вес 63 кг, цвет — чёрный, Black Edition (чёрная серия)."],faq:[{q:"Подойдёт ли Falcon Lite новичку?",a:"Да, это модель для начинающих. У Lite самая низкая посадка в линейке — 820 мм, как у Pro, мягкий режим Eco и понятное управление."},{q:"Чем Falcon Lite отличается от Falcon Pro?",a:"Lite проще и доступнее: 280 000 ₽ против 310 000 ₽, мотор 8 кВт против 10 кВт, батарея 30 Ач против 35 Ач, запас хода 60–80 км против 60–120 км, нет NFC-запуска. Зато зарядка быстрее — 3 ч, а сиденье такое же низкое — 820 мм."},{q:"Сколько Falcon Lite проезжает на одном заряде?",a:"60–80 км в зависимости от веса райдера, рельефа и режима. Полная зарядка — 3 ч."},{q:"Сколько стоит Falcon Lite?",a:"280 000 ₽ — это самый доступный Falcon. Lite можно взять в рассрочку: менеджер рассчитает ежемесячный платёж."}],seoTitle:"Купить Falcon Lite — электробайк для новичков | 79BIKE",seoDescription:"Falcon Lite в официальном магазине 79BIKE: 8 кВт, 84 км/ч, сиденье 820 мм, зарядка 3 ч. Для начинающих. Гарантия и доставка по России."},"lynx-x":{title:"Falcon Lynx X | 79BIKE",h1:"Электромотоцикл Falcon Lynx X",lead:"Самый мощный Falcon: 26 кВт, 550 Н·м и батарея 60 Ач. Старт продаж — 2027: оставьте номер, и мы сообщим о старте первыми.",home:["Lynx X сделан для бездорожья и сложных участков. Мотор 26 кВт с моментом 550 Н·м, контроллер FOC с искусственным интеллектом, широкое заднее колесо 4.1-18 и самые крупные в линейке тормозные диски — 240 мм.","Батарея 72 В 60 Ач на элементах LG RH60 — до 128 км на заряде. Ход подвески 225 мм спереди и 220 мм сзади, клиренс 280 мм, контурная подсветка Star Ring. Сиденье 870 мм — посадка для высоких райдеров. Рама чёрная с золотыми вставками — Black Gold (чёрный с золотым). Старт продаж — 2027."],body:["Falcon Lynx X — старшая модель линейки Lynx и самый мощный Falcon. Он рассчитан на крутые подъёмы, камни, корни и глубокую грязь, где лёгким байкам не хватает тяги.","Мотор PMSM выдаёт 26 кВт пиковой мощности (13 кВт номинальной) и 550 Н·м, разгоняет байк до 100 км/ч. Контроллер 79BIKE FOC с искусственным интеллектом — 72 В, синусоидальный векторный — дозирует тягу плавно и без рывков. Широкое заднее колесо 4.1-18 держит сцепление на сложном грунте, а тормозные диски 240 × 3,0 мм спереди и сзади останавливают байк уверенно и предсказуемо.","Рама из алюминия 6061, ход подвески 225 мм спереди и 220 мм сзади, клиренс 280 мм, колёсная база 1320 мм. Влагозащита IP67, контурная LED-подсветка Star Ring с интеллектуальной регулировкой. Вес с батареей — 83 кг, цвет — Black Gold (чёрный с золотым), как у Lynx Trail в этой же расцветке.","Батарея 72 В 60 Ач на элементах LG RH60 — самая ёмкая среди Falcon: до 128 км при скорости 40 км/ч. Полная зарядка — 4 ч, ток зарядки 15 А с регулировкой. Как и Lynx Trail, Lynx X рассчитан на высоких райдеров: по спецификации производителя высота сиденья 870 мм, максимальная нагрузка 120 кг. Старт продаж — 2027 год."],faq:[{q:"Когда Falcon Lynx X поступит в продажу?",a:"Старт продаж — 2027 год. Оставьте номер в форме «Сообщить о старте продаж» — мы позвоним или напишем, как только байк можно будет заказать."},{q:"Сколько будет стоить Falcon Lynx X?",a:"Цену объявим к старту продаж в 2027 году. Те, кто оставил номер, узнают её первыми."},{q:"Чем Lynx X отличается от Lynx Trail?",a:"Lynx X мощнее — 26 кВт против 10 кВт, у него больше момент, батарея 60 Ач вместо 40 Ач, шире заднее колесо, крупнее тормозные диски и длиннее ход подвески. Обе модели рассчитаны на высоких райдеров, но у Lynx X сиденье выше — 870 мм против 855 мм. Lynx Trail уже в продаже, старт продаж Lynx X — 2027."},{q:"Кому подойдёт Lynx X?",a:"Опытным и высоким райдерам, которые ездят по сложному бездорожью. Возраст райдера — с 18 лет, максимальная нагрузка — 120 кг. Новичкам лучше начать с Falcon Pro или Falcon Lite."},{q:"В каком цвете будет Falcon Lynx X?",a:"Black Gold (чёрный с золотым): рама чёрная, вставки золотые — как у Lynx Trail в этой же расцветке. На фото — предсерийный образец из спецификации производителя."}],seoTitle:"Falcon Lynx X — самый мощный электроэндуро Falcon",seoDescription:"Falcon Lynx X: 26 кВт, 550 Н·м, батарея 60 Ач, до 128 км. Старт продаж — 2027, официальный магазин 79BIKE. Оставьте номер — сообщим о старте."},"surge-v":{title:"Y-Volt Surge V",h1:"Электромотоцикл Y-Volt Surge V",lead:"Полноразмерный электроэндуро для профессионалов: 35 кВт пиковой мощности, 948 Н·м на колесе и до 115 км/ч.",home:["Surge V — полноразмерный эндуро: колёса 19″ и 18″, воздушная подвеска спереди и сзади, сиденье 900 мм и клиренс 300 мм. По размеру и характеру он ближе к кроссовому мотоциклу, чем к лёгкому электробайку.","Мотор 35 кВт и 948 Н·м на колесе, батарея 97 В 45 Ач на элементах Samsung 50S — до 120 км на заряде (при 25 км/ч) и зарядка за 3 ч. Режимы Eco, Drive и Sport, задний ход R, парковка P и удержание N; защита от угона — в приложении, влагозащита IP67, полностью светодиодный свет."],body:["Y-Volt Surge V — для райдеров, которые выросли из лёгких электробайков и хотят полноразмерный эндуро без бензина, масла и шума. Колёса 19″ спереди и 18″ сзади, колёсная база 1360 мм, клиренс 300 мм и сиденье на высоте 900 мм — это техника для абсолютного бездорожья и опытного райдера.","Пиковая мощность мотора — 35 кВт (47,6 л. с.), номинальная — 15 кВт, крутящий момент на колесе — 948 Н·м, максимальная скорость — 115 км/ч (режим Sport). Батарея 97 В 45 Ач на элементах Samsung 50S (тройной литий, IP67) даёт до 120 км запаса хода при 25 км/ч и заряжается за 3 ч. Байк весит 95 кг, допустимая нагрузка — 120 кг.","Подвеска спереди и сзади — воздушная, вилка регулируется по сжатию и отскоку. Рама — кованая алюминиевая, трёхбалочная; привод — редуктор и цепь. Тормоза гидравлические дисковые, с 4-поршневыми суппортами. Руль алюминиевый, ширина 810 мм.","Режимы езды на дисплее: E — Eco, до 50 км/ч; D — Drive, до 80 км/ч; S — Sport, до 115 км/ч. Для манёвров есть задний ход R (долгое нажатие кнопки M/R), для стоянки — парковка P, режим N — удержание (Hold). Приложение YVOLT: байк привязывается к смартфону по номеру IMEI. Свет полностью светодиодный: дальний и ближний. Запуск по NFC — карта и браслет в комплекте. Влагозащита — IP67, цвета — «Белый графит» и «Серый графит».","Купить Y-Volt Surge V можно в фирменном магазине 79BIKE с быстрой доставкой по РФ. По Москве, Московской области и городам до 600 км от Москвы байк привезёт наш курьер за 1–2 дня, в другие города — транспортная компания, от 2 дней. Жители Москвы и МО могут записаться на тест-драйв в шоуруме «Речников 21». Рассрочка доступна и на эту модель (с процентами). Surge V продаётся официально — с гарантией, сервисом и оригинальными запчастями в России."],faq:[{q:"Что значит «полноразмерный эндуро»?",a:"Это байк по размеру, весу и ходу подвески близкий к классическому кроссовому мотоциклу. У Surge V колёса 19″ и 18″, воздушная подвеска спереди и сзади, клиренс 300 мм и сиденье на высоте 900 мм. Он рассчитан на взрослого опытного райдера и серьёзное бездорожье, а не на прогулки по парку."},{q:"Какая максимальная скорость у Y-Volt Surge V?",a:"До 115 км/ч в режиме Sport. Пиковая мощность мотора — 35 кВт (47,6 л. с.), номинальная — 15 кВт, крутящий момент на колесе — 948 Н·м."},{q:"На какой рост рассчитан Surge V?",a:"Высота сиденья — 900 мм, самая высокая в нашем каталоге. Комфортно на нём примерно от 165 см. Проверить посадку можно в блоке «Примерка по росту» выше на странице, а точно — на тест-драйве в шоуруме в Москве (по звонку)."},{q:"Кому подойдёт Y-Volt Surge V?",a:"Опытным райдерам и тем, кто пересаживается с бензинового эндуро. Если вы только начинаете, выберите Falcon Pro или Falcon Lite."},{q:"Сколько стоит Y-Volt Surge V и есть ли он в наличии?",a:"495 000 ₽. Наличие и сроки поставки уточнит менеджер — оставьте номер или позвоните. Рассрочка доступна и на эту модель."},{q:"Можно ли прокатиться на Surge V перед покупкой?",a:"Да, если вы живёте в Москве или Московской области. Тест-драйв — в шоуруме «Речников 21», только по предварительной записи. Запишитесь по телефону или через форму — подготовим байк к вашему приезду."},{q:"Как доставляют Surge V?",a:"По Москве, МО и городам до 600 км от Москвы — нашим курьером за 1–2 дня. В другие города — транспортной компанией, от 2 дней. Байк едет в штатной заводской коробке 212 × 45 × 118 см, вес с упаковкой — 146 кг; груз застрахован."},{q:"Есть ли на Surge V официальная гарантия?",a:"Да. Surge V продаётся через фирменный магазин 79BIKE, поэтому на него действует официальная гарантия 6 месяцев, сервис и оригинальные запчасти в России."}],seoTitle:"Купить Y-Volt Surge V — электроэндуро 35 кВт в Москве",seoDescription:"Y-Volt Surge V: 35 кВт, 948 Н·м, до 115 км/ч, сиденье 900 мм. Цена 495 000 ₽. Фирменный магазин 79BIKE: тест-драйв в Москве и МО, доставка по РФ."}},compareSection:{title:"Сравните модели Falcon, Lynx и Y-Volt",subtitle:"Все характеристики в одной таблице. Выберите байк по мощности, запасу хода, весу и высоте сиденья.",flagHint:"Значение уточняется у производителя",emptyValue:"уточняется",linkAll:"Открыть полное сравнение"},greyImport:{title:"Покупайте только в официальном магазине",text:"Байки, ввезённые из других стран частным образом — не через официальный магазин 79BIKE и дилеров бренда, — блокируются после активации, разблокировать их нельзя. На них нет гарантии и техподдержки в России. У нас каждый байк официальный: с гарантией, сервисом и запчастями.",textShort:"Байки из других стран блокируются после активации, и разблокировать их нельзя. Покупайте в официальном магазине 79BIKE или у дилеров бренда — с гарантией и сервисом в России."},reviewsHome:{title:"Видеообзоры",subtitle:"Посмотрите, как байки ведут себя на бездорожье, прежде чем выбрать.",allModel:"Все обзоры модели",freshTitle:"Свежие видео с Rutube",more:"Смотреть ещё"},ownerReviews:{title:"Отзывы владельцев",subtitle:"Что пишут покупатели о своих байках.",items:[{name:"Дмитрий",text:"79 bike даёт непревзойдённые впечатления от езды на этом электромотоцикле. Порадовали плавный, но приёмистый двигатель, прочная конструкция и понятный интерфейс. Это чистый кайф и свобода, даже лучше, чем купить суррон. В общем, 79 bike pro рулит."},{name:"Сергей",text:"Falcon Pro — это просто зверь! Взял для дачи, но теперь катаемся всей семьёй. Проходит любые тропы, мощность бешеная. За 5 минут уже понял, что Sur-Ron и Талария — отдыхают!"},{name:"Андрей",text:"Купил Falcon Pro в подарок сыну — теперь гоняем по выходным вместе. Безопасный старт, но мощи хватает с головой. Долго выбирал между Talaria и Falcon — не пожалел ни секунды! Едет бодро, аморты хорошие, тяга отличная. Отдельно плюс за лёгкую настройку — сел и поехал. Реально классный байк за свои деньги!"}],leave:"Оставить отзыв",moderation:"Отзывы публикуются после модерации",form:{title:"Ваш отзыв",name:{label:"Имя",placeholder:"Как к вам обращаться"},model:{label:"Модель",placeholder:"Выберите модель"},text:{label:"Отзыв",placeholder:"Что понравилось, где катаетесь, что посоветуете другим"},button:"Отправить отзыв",success:"Спасибо за отзыв! Он появится на сайте после модерации."}},faqSection:{title:"Вопрос-ответ",subtitle:"Не нашли ответ? Позвоните или напишите в мессенджер — ответим по-человечески и без шаблонов.",contactCta:"Задать вопрос"},faq:[{q:"Нужны ли права и регистрация?",a:"Байки продаются как спортивный инвентарь и предназначены для езды по бездорожью, трассам и закрытым площадкам, где права и регистрация не требуются. ПТС для всех электрических байков не предусмотрен, на учёт они не ставятся. При этом у моделей Falcon и Lynx мощность может быть ограничена режимом Eco до 3,9 кВт. Режим Eco не меняет тип транспортного средства."},{q:"Какой максимальный вес райдера?",a:"По данным производителя: Falcon GT — 120 кг, Falcon Pro — 120 кг, Y-Volt Surge V — 120 кг, Falcon Lite — 120 кг, Falcon Lynx X — 120 кг, Falcon Lynx Trail — 120 кг."},{q:"Какая максимальная скорость?",a:"Y-Volt Surge V — 115 км/ч, Falcon Lynx X — 100 км/ч, Falcon GT — 95 км/ч, Falcon Pro и Lynx Trail — 90 км/ч, Falcon Lite — 84 км/ч. Скорость зависит от режима: максимум — в Sport."},{q:"Сколько можно проехать на одном заряде?",a:"Falcon Lite — 60–80 км, Falcon GT, Pro и Lynx Trail — 60–120 км, Lynx X — 60–128 км, Y-Volt Surge V — до 120 км. Реальный запас хода зависит от веса райдера, рельефа, скорости и режима: в Eco вы проедете больше, чем в Sport."},{q:"Сколько времени занимает зарядка?",a:"Falcon Lite и Y-Volt Surge V заряжаются за 3 ч, GT и Pro — за 3,5 ч, Lynx Trail и Lynx X — за 4 ч. Используйте штатное зарядное устройство: с несовместимым зарядником гарантия на батарею не действует."},{q:"Сколько циклов зарядки выдерживает батарея?",a:"800–1000 полных циклов зарядки. Чтобы батарея служила дольше, заряжайте её штатным зарядным устройством и не храните байк долго полностью разряженным."},{q:"Какого размера коробка с байком?",a:"Falcon (GT, Pro, Lite) и Lynx: 168 × 34 × 88 см, вес с упаковкой — 86 кг. Y-Volt Surge V: 212 × 45 × 118 см, 146 кг. Коробка стоит на деревянном поддоне — удобно грузить рохлей. Подходит для легковой машины с большим багажником или грузового такси — уточните размеры перед самовывозом."},{q:"Можно ли ездить в дождь и по лужам?",a:"Да. У всех моделей Falcon и у Y-Volt Surge V влагозащита IP67 — дождь и лужи им не помеха. Но не мойте байк под сильным напором и не заезжайте в глубокий брод: попадание воды внутрь узлов не покрывается гарантией. Как байки 79BIKE проверяют водой на заводе — в роликах производителя ниже; это испытания на пределе, повторять их не стоит.",videos:[{url:"https://www.youtube.com/watch?v=leuOT4Df6Dg",title:"Испытание водозащиты 79BIKE",duration:"1:39",sprite:"assets/video/water.webp",pos:"100% 0"},{url:"https://www.youtube.com/watch?v=a3MjPB4hE3o",title:"Тест на воду: заезд в реку",duration:"0:31",sprite:"assets/video/water.webp",pos:"0 0"}]},{q:"Какая гарантия?",a:"Официальная гарантия 79BIKE — 6 месяцев на контроллер, батарею, двигатель и раму. Гарантийный ремонт и техподдержка — в России. Доставка байка в сервис и обратно — за счёт покупателя; многие вопросы решаем дистанционно — диагностика по видео и отправка детали СДЭК. Подробные условия — на странице «Гарантия».",link:{text:"Условия гарантии",href:"warranty.html"}},{q:"Как быстро доставите и сколько это стоит?",a:"По Москве и Московской области доставляем нашими курьерами — за 1–2 дня. Нашим курьером можем привезти байк собранным в радиусе до 600 км от Москвы. В регионы отправляем в течение двух рабочих дней через ПЭК, Деловые линии и другие транспортные компании — в штатной заводской коробке, она надёжно защищает байк. Все отправления застрахованы. Сроки — от 2 дней, зависят от транспортной компании; условия и стоимость обсудите с менеджером. Запчасти отправляем СДЭК."},{q:"Как оплатить и можно ли в рассрочку?",a:"В Москве и Московской области можно бесплатно забрать байк из шоурума «Речников 21», а при доставке нашим курьером оплатить при получении — предоплата только за доставку. Для регионов — полная предоплата до отправки, в Санкт-Петербурге — можно оплатить при получении в пункте выдачи; при доставке нашим курьером (в радиусе до 600 км от Москвы) — оплата при получении, предоплата только за доставку. Можно оформить рассрочку с процентами — условия на странице рассрочки.",blocks:[{h:"Москва, МО и ближние города (наш курьер, до 600 км)",t:"В Москве и Московской области можно бесплатно забрать байк из шоурума «Речников 21». При доставке нашим курьером — в Москве, области и в радиусе до 600 км от Москвы — оплата при получении, предоплата только за доставку."},{h:"Другие города — транспортной компанией",t:"Полная предоплата до отправки. В Санкт-Петербурге — можно оплатить при получении в пункте выдачи."},{h:"Рассрочка",t:"Можно оформить рассрочку с процентами — условия на странице рассрочки.",link:{text:"Условия рассрочки",href:"credit.html"}}]},{q:"Где взять запчасти и расходники?",a:"У нас. Как официальный магазин 79BIKE мы держим запчасти и расходники в наличии в России, поэтому ремонт не ждёт поставки из-за границы. Назовите модель — подберём нужную деталь; в регионы отправляем запчасти СДЭК."},{q:"Чем официальный байк отличается от «серого»?",a:"Байки, ввезённые из других стран частным образом — не через официальный магазин 79BIKE и дилеров бренда, — блокируются после активации, и разблокировать их нельзя. На них нет гарантии, сервиса и техподдержки в России. Официальный байк вы получаете с гарантией, запчастями и русскоязычной поддержкой."},{q:"Байк приедет собранным?",a:"Сборку и настройку байка мы делаем — условия уточняйте у менеджера. Если собираете сами, для каждой модели есть инструкция по сборке и эксплуатации, а техподдержка подскажет по телефону или в мессенджере."},{q:"Можно ли посмотреть байк вживую и прокатиться?",a:"Да, если вы в Москве или Московской области: тест-драйв проводим только там. Шоурум — в Москве, в бизнес-пространстве «Речников 21». Приезжайте строго по предварительной договорённости: подготовим нужную модель и проведём тест-драйв по звонку. Приезжайте в удобное для вас время — просто позвоните заранее."},{q:"Можно ли вернуть байк?",a:"Электромотоцикл — технически сложный товар, поэтому возврат после покупки невозможен. Мы хотим, чтобы вы были уверены в выборе заранее: поможем подобрать модель по росту и опыту, ответим на все вопросы, а в Москве и Московской области можно приехать на тест-драйв. Если с байком что-то случится — действует официальная гарантия 6 месяцев."},{q:"Чем Falcon отличается от Sur-Ron и Talaria?",a:"Это байки одного класса — лёгкие электроэндуро, поэтому их удобно сравнивать по мощности, моменту, батарее и весу: все цифры Falcon есть в таблице сравнения. Для покупателя в России важнее другое: Falcon продаётся через официальный магазин 79BIKE и дилеров бренда, с гарантией, сервисом и запчастями здесь."},{q:"Какая максимальная скорость у Falcon GT?",a:"95 км/ч. Пиковая мощность мотора — 17 кВт, крутящий момент — 610 Н·м.",models:["gt"]},{q:"Подойдёт ли Falcon GT новичку?",a:"GT рассчитан на райдеров с опытом: это самая мощная модель Falcon в наличии. Если вы только начинаете, катайтесь в режиме Eco или присмотритесь к Falcon Pro и Falcon Lite — они проще в управлении.",models:["gt"]},{q:"Чем Falcon GT отличается от Falcon Pro?",a:"У GT мощнее мотор — 17 кВт против 10 кВт, выше момент — 610 Н·м против 410 Н·м, и скорость — 95 км/ч против 90 км/ч. Батарея GT больше — 40 Ач на элементах Samsung, а заднее колесо шире. Pro легче на 10 кг и проще для новичка.",models:["gt","pro"]},{q:"Сколько Falcon GT проезжает на одном заряде?",a:"60–120 км. Запас хода зависит от веса райдера, рельефа, скорости и режима. Батарея заряжается полностью за 3,5 ч.",models:["gt"]},{q:"В каких цветах есть Falcon GT?",a:"Модельный ряд 2026 года и позднее производится в чёрном и белом цветах — Exclusive Black и Exclusive White. Наличие цвета уточняйте у менеджера при заказе.",models:["gt"]},{q:"Какая максимальная скорость у Falcon Pro?",a:"90 км/ч. Пиковая мощность мотора — 10 кВт, крутящий момент — 410 Н·м.",models:["pro"]},{q:"Подойдёт ли Falcon Pro новичку?",a:"Да. Pro — самый лёгкий Falcon, 59 кг, и прощает ошибки. Начните в режиме Eco, а когда освоитесь, переключайтесь на Drive и Sport.",models:["pro"]},{q:"Можно ли ездить на Falcon Pro в дождь?",a:"Да. Влагозащита Falcon Pro — IP67, дождь и лужи ему не помеха. Но не мойте байк под сильным напором и не заезжайте в глубокий брод: попадание воды внутрь узлов не покрывается гарантией.",models:["pro"]},{q:"Какие цвета есть у Falcon Pro?",a:"Рама чёрная или серебристая со вставками фиолетового, жёлтого или красного цвета: Black Purple, Black Red, Black Yellow, Silver Purple, Silver Red и Silver Yellow. К чёрной раме есть ещё полностью чёрный вариант Black Edition (чёрная серия). Наличие сочетания уточняйте у менеджера.",models:["pro"]},{q:"Сколько Falcon Pro проезжает на одном заряде?",a:"60–120 км в зависимости от веса райдера, рельефа, скорости и режима. Полная зарядка — 3,5 ч.",models:["pro"]},{q:"На какой рост рассчитан Falcon Lynx Trail?",a:"На высоких райдеров: сиденье 855 мм, колёсная база 1270 мм, задняя подвеска с ходом 200 мм. Максимальная нагрузка по данным производителя — 120 кг. Если нужна посадка выше — посмотрите Lynx X с сиденьем 870 мм (старт продаж — 2027). Проверить посадку можно в блоке «Примерка по росту» выше на странице, а точно — на тест-драйве в шоуруме (по звонку).",models:["lynx-trail"]},{q:"Как работает музыка и что умеет приложение?",a:"В Lynx Trail встроена Bluetooth-колонка: подключаете телефон и включаете треки с него прямо во время поездки. Байк поддерживает фирменное приложение 79Cloud (App Store и Google Play): запуск без ключа, данные поездки, настройка режимов, сервис и диагностика. В России оно пока работает в тестовом режиме: отдельные функции могут работать не всегда корректно, и производитель продолжает его дорабатывать. Основные функции байка от приложения не зависят — всё управление на руле. Актуальные возможности подскажет менеджер.",models:["lynx-trail"]},{q:"Сколько стоит Falcon Lynx Trail?",a:"355 000 ₽. Наличие цветов уточнит менеджер — оставьте номер или позвоните. Рассрочка доступна и на эту модель.",models:["lynx-trail"]},{q:"Чем Lynx Trail отличается от Lynx X?",a:"Lynx X — самая мощная версия линейки Lynx: 26 кВт против 10 кВт, батарея 60 Ач против 40 Ач, более широкое заднее колесо и сиденье выше — 870 мм против 855 мм. Lynx Trail уже в продаже, старт продаж Lynx X — 2027.",models:["lynx-trail"]},{q:"Сколько заряжается Lynx Trail?",a:"Полная зарядка — 4 ч. Запас хода — 60–120 км в зависимости от веса райдера, рельефа и режима.",models:["lynx-trail"]},{q:"Подойдёт ли Falcon Lite новичку?",a:"Да, это модель для начинающих. У Lite самая низкая посадка в линейке — 820 мм, как у Pro, мягкий режим Eco и понятное управление.",models:["light"]},{q:"Чем Falcon Lite отличается от Falcon Pro?",a:"Lite проще и доступнее: 280 000 ₽ против 310 000 ₽, мотор 8 кВт против 10 кВт, батарея 30 Ач против 35 Ач, запас хода 60–80 км против 60–120 км, нет NFC-запуска. Зато зарядка быстрее — 3 ч, а сиденье такое же низкое — 820 мм.",models:["light"]},{q:"Сколько Falcon Lite проезжает на одном заряде?",a:"60–80 км в зависимости от веса райдера, рельефа и режима. Полная зарядка — 3 ч.",models:["light"]},{q:"Сколько стоит Falcon Lite?",a:"280 000 ₽ — это самый доступный Falcon. Lite можно взять в рассрочку: менеджер рассчитает ежемесячный платёж.",models:["light"]},{q:"Когда Falcon Lynx X поступит в продажу?",a:"Старт продаж — 2027 год. Оставьте номер в форме «Сообщить о старте продаж» — мы позвоним или напишем, как только байк можно будет заказать.",models:["lynx-x"]},{q:"Сколько будет стоить Falcon Lynx X?",a:"Цену объявим к старту продаж в 2027 году. Те, кто оставил номер, узнают её первыми.",models:["lynx-x"]},{q:"Чем Lynx X отличается от Lynx Trail?",a:"Lynx X мощнее — 26 кВт против 10 кВт, у него больше момент, батарея 60 Ач вместо 40 Ач, шире заднее колесо, крупнее тормозные диски и длиннее ход подвески. Обе модели рассчитаны на высоких райдеров, но у Lynx X сиденье выше — 870 мм против 855 мм. Lynx Trail уже в продаже, старт продаж Lynx X — 2027.",models:["lynx-x"]},{q:"Кому подойдёт Lynx X?",a:"Опытным и высоким райдерам, которые ездят по сложному бездорожью. Возраст райдера — с 18 лет, максимальная нагрузка — 120 кг. Новичкам лучше начать с Falcon Pro или Falcon Lite.",models:["lynx-x"]},{q:"В каком цвете будет Falcon Lynx X?",a:"Black Gold (чёрный с золотым): рама чёрная, вставки золотые — как у Lynx Trail в этой же расцветке. На фото — предсерийный образец из спецификации производителя.",models:["lynx-x"]},{q:"Что значит «полноразмерный эндуро»?",a:"Это байк по размеру, весу и ходу подвески близкий к классическому кроссовому мотоциклу. У Surge V колёса 19″ и 18″, воздушная подвеска спереди и сзади, клиренс 300 мм и сиденье на высоте 900 мм. Он рассчитан на взрослого опытного райдера и серьёзное бездорожье, а не на прогулки по парку.",models:["surge-v"]},{q:"Какая максимальная скорость у Y-Volt Surge V?",a:"До 115 км/ч в режиме Sport. Пиковая мощность мотора — 35 кВт (47,6 л. с.), номинальная — 15 кВт, крутящий момент на колесе — 948 Н·м.",models:["surge-v"]},{q:"На какой рост рассчитан Surge V?",a:"Высота сиденья — 900 мм, самая высокая в нашем каталоге. Комфортно на нём примерно от 165 см. Проверить посадку можно в блоке «Примерка по росту» выше на странице, а точно — на тест-драйве в шоуруме в Москве (по звонку).",models:["surge-v"]},{q:"Кому подойдёт Y-Volt Surge V?",a:"Опытным райдерам и тем, кто пересаживается с бензинового эндуро. Если вы только начинаете, выберите Falcon Pro или Falcon Lite.",models:["surge-v"]},{q:"Сколько стоит Y-Volt Surge V и есть ли он в наличии?",a:"495 000 ₽. Наличие и сроки поставки уточнит менеджер — оставьте номер или позвоните. Рассрочка доступна и на эту модель.",models:["surge-v"]},{q:"Есть ли на Surge V официальная гарантия?",a:"Да. Surge V продаётся через фирменный магазин 79BIKE, поэтому на него действует официальная гарантия 6 месяцев, сервис и оригинальные запчасти в России.",models:["surge-v"]}],delivery:{title:"Оплата и доставка",payment:[{reg:"msk",title:"Москва и МО",text:"Бесплатный самовывоз из шоурума «Речников 21»."},{reg:"msk",title:"Курьером",text:"При доставке нашим курьером оплата при получении. Предоплата — только за доставку."},{reg:"near",title:"Города до 600 км от Москвы",text:"Привезём нашим курьером или отправим транспортной компанией — на выбор."},{reg:"near",title:"Нашим курьером",text:"Оплата при получении. Предоплата — только за доставку."},{reg:"near",title:"Транспортной компанией",text:"Полная предоплата до отправки. В Санкт-Петербурге — можно оплатить при получении в пункте выдачи."},{reg:"rf",title:"Регионы",text:"Полная предоплата до отправки. В Санкт-Петербурге — можно оплатить при получении в пункте выдачи."},{title:"Рассрочка",text:"Можно оформить рассрочку с процентами.",link:{text:"Условия рассрочки",href:"credit.html"}}],regions:{msk:"Москва и МО",near:"Города до 600 км от Москвы",rf:"Другой город"},shipping:[{title:"Нашим курьером: Москва и МО",text:"По Москве и Московской области доставляем нашими курьерами — за 1–2 дня. В радиусе до 600 км от Москвы можем привезти байк собранным. Условия доставки обсудите с менеджером."},{title:"Транспортной компанией по России",text:"Отправляем в течение двух рабочих дней через ПЭК, Деловые линии и другие транспортные компании — до терминала или до двери. Байк едет в штатной заводской коробке: она надёжно защищает его в пути, обрешётка не нужна. Все отправления застрахованы. Сроки — от 2 дней, зависят от транспортной компании."},{title:"Самовывоз в Москве",text:"Из шоурума «Речников 21» — в удобное для вас время, по предварительному звонку."}],boxes:[{title:"Falcon GT, Pro, Lite и Lynx",dims:"168 × 34 × 88 см",weight:"86 кг"},{title:"Y-Volt Surge V",dims:"212 × 45 × 118 см",weight:"146 кг"}],vanPhoto:{img:"assets/delivery/van-gt.webp",alt:"Белый фургон 79BIKE и Falcon GT у склада",caption:"По Москве и области привозим байк своим фургоном"},boxPhotos:[{img:"assets/box/box-gt.webp",caption:"Коробка Falcon GT"},{img:"assets/box/box-pro.webp",caption:"Коробка Falcon Pro"}],note:"Сборка и доставка до двери возможны — условия уточняйте у менеджера. Запчасти и аксессуары отправляем СДЭК.",homeTitle:"Доставка и оплата",homeSubtitle:"Байки доставляем по всей России: по Москве и области — нашими курьерами за 1–2 дня, в регионы — ПЭК, Деловыми линиями и другими ТК. Запчасти — СДЭК. Оплатить можно онлайн, в рассрочку или договориться с менеджером.",more:"Подробнее об оплате и доставке",moreUrl:"delivery.html",page:{lead:"Байки доставляем по всей России. Выберите свой город — покажем способ, срок и условия оплаты.",nav:[["ways","Способы"],["terms","Сроки"],["pay","Оплата"],["pack","Упаковка"],["faq","Вопросы"]],cities:[{k:"msk",label:"Москва и МО",rows:[{ic:"truck",h:"Способ",t:"**Наш курьер** привезёт байк по Москве и области. Или бесплатный самовывоз из шоурума «Речников 21» — по предварительному звонку."},{ic:"clock",h:"Срок",t:"**1–2 дня**"},{ic:"card",h:"Оплата",t:"**При получении.** Предоплата — только за доставку."},{ic:"wrench",h:"Сборка",t:"Можем привезти байк **собранным**."}]},{k:"near",label:"Города до 600 км от Москвы",rows:[{ic:"tru
